<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Rakhi Pournami</title>
    <style>
        body {
            background-color: #fdf2f2;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 350px;
            border-top: 6px solid #d9534f;
        }
        .rakhi-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        h1 {
            color: #d9534f;
            font-size: 24px;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .footer {
            font-weight: bold;
            color: #333;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="rakhi-icon">🔴</div>
        <h1>Happy Rakhi Pournami!</h1>
        <p>To my wonderful sister, thank you for always being my best friend, protector, and guide. Wishing you a joyful Raksha Bandhan!</p>
        <div class="footer">With Love ❤️</div>
    </div>

</body>
</html>
